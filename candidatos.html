<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Candidatos - Bruna Pessoa</title>
    <!-- Font Awesome para ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-blue: #0d5cbe;
            --brand-cyan: #52c4db;
            --brand-yellow: #fcd116;
            --text-dark: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Moldura estilo Celular */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: #f2f4f8;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Cabeçalho */
        .top-header {
            background-color: var(--brand-blue);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: background-color 0.2s;
        }

        .back-button:hover, .back-button:active {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .header-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Área do Conteúdo */
        .content-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Card da Arte */
        .card-container {
            width: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.5s ease-out;
        }

        /* Exibição Completa da Imagem sem Distorção */
        .art-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Botão do Instagram acoplado na base do card */
        .instagram-btn {
            background: linear-gradient(135deg, #e11d74, #5e17eb);
            color: white;
            text-decoration: none;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .instagram-btn:hover, .instagram-btn:active {
            opacity: 0.9;
        }

        .instagram-btn i {
            font-size: 1.3rem;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- CABEÇALHO COM BOTÃO VOLTAR -->
        <div class="top-header">
            <a href="index.html" class="back-button" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title">MEUS CANDIDATOS</div>
        </div>

        <!-- CONTEÚDO -->
        <div class="content-area">
            
            <div class="card-container">
                <!-- EXIBE A SUA ARTE ORIGINAL INTEIRA -->
                <img src="FOTOBRUNAPESSOA.png" alt="Bruna Pessoa 15800" class="art-image">

                <!-- BOTÃO DO INSTAGRAM -->
                <a href="https://www.instagram.com/brunapessoama/" target="_blank" class="instagram-btn">
                    <i class="fa-brands fa-instagram"></i>
                    Acessar Instagram Oficial
                </a>
            </div>

        </div>

    </div>

</body>
</html>
