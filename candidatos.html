<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruna Pessoa 15800 - Meus Candidatos</title>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-bg: #5a008a;
            --pink-stripe: #e3127d;
            --purple-number: #5200a4;
            --pink-title: #e3127d;
            --text-dark: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container que simula a tela do celular */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Botão de voltar flutuante (topo esquerdo) */
        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 30;
            width: 38px;
            height: 38px;
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        .back-btn:hover, .back-btn:active {
            background-color: rgba(255, 255, 255, 0.45);
            transform: scale(1.08);
        }

        /* Faixa Roxa na Esquerda */
        .left-purple-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 22%;
            background-color: var(--purple-bg);
            z-index: 1;
        }

        /* Faixa Rosa Fina */
        .left-pink-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 22%;
            width: 4%;
            background-color: var(--pink-stripe);
            z-index: 1;
        }

        /* Foto da Bruna Ajustada */
        .photo-bruna {
            position: absolute;
            bottom: 0;
            left: -5px;
            width: 53%;
            max-height: 70vh;
            object-fit: contain;
            object-position: bottom left;
            z-index: 2;
            pointer-events: none;
        }

        /* Bloco de Textos no Lado Direito (Sem invadir a foto) */
        .right-content {
            position: absolute;
            top: 13%;
            left: 45%;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Texto da Bio */
        .bio-list {
            font-size: 0.78rem;
            line-height: 1.38;
            color: var(--text-dark);
            font-weight: 500;
            margin-bottom: 14px;
        }

        /* Nome Bruna Pessoa */
        .candidate-name {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--pink-title);
            line-height: 1.1;
            margin-bottom: 2px;
        }

        /* Número 15800 */
        .candidate-number {
            font-size: 3.1rem;
            font-weight: 900;
            color: var(--purple-number);
            line-height: 0.95;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        /* Tag do Instagram */
        .insta-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background-color: #e8e8e8;
            padding: 5px 12px;
            border-radius: 20px;
            text-decoration: none;
            color: #333333;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 25px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .insta-pill:hover, .insta-pill:active {
            transform: scale(1.05);
            background-color: #dadada;
        }

        .verified-icon {
            color: #1da1f2;
            font-size: 0.8rem;
        }

        /* Botão / Ícone da Mãozinha */
        .click-icon-link {
            align-self: flex-end;
            margin-right: 10px;
            text-decoration: none;
            display: block;
            transition: transform 0.2s;
        }

        .click-icon-link:hover, .click-icon-link:active {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- BOTÃO DE VOLTAR -->
        <a href="index.html" class="back-btn" title="Voltar para a página inicial">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <!-- FAIXAS LATERAIS -->
        <div class="left-purple-bar"></div>
        <div class="left-pink-bar"></div>

        <!-- FOTO DA BRUNA -->
        <img src="FOTOBRUNAPESSOA.png" alt="Bruna Pessoa" class="photo-bruna">

        <!-- CONTEÚDO DO LADO DIREITO -->
        <div class="right-content">
            
            <!-- BIO -->
            <div class="bio-list">
                Oi, minha gente<br>
                Candidata a deputada<br>
                estadual do MA 15800<br>
                Filha de Deus<br>
                Mamãe do Luís Miguel<br>
                Advogada<br>
                Empreendedora
            </div>

            <!-- NOME DA CANDIDATA -->
            <div class="candidate-name">Bruna Pessoa</div>

            <!-- NÚMERO -->
            <div class="candidate-number">15800</div>

            <!-- INSTAGRAM BADGE -->
            <a href="https://www.instagram.com/brunapessoama/" target="_blank" class="insta-pill">
                <span>brunapessoama</span>
                <i class="fa-solid fa-circle-check verified-icon"></i>
            </a>

            <!-- ÍCONE DA MÃOZINHA -->
            <a href="https://www.instagram.com/brunapessoama/" target="_blank" class="click-icon-link" title="Acessar Instagram">
                <svg width="65" height="65" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="48" y="10" width="44" height="24" rx="12" stroke="#e3127d" stroke-width="5" fill="none"/>
                    <path d="M62 22H78M72 17L78 22L72 27" stroke="#e3127d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M40 88V52C40 47 44 43 49 43C54 43 58 47 58 52V28C58 23 65 23 65 28V38" stroke="#e3127d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M40 60C34 60 28 65 28 72C28 80 35 88 42 88" stroke="#e3127d" stroke-width="5" stroke-linecap="round"/>
                    <path d="M65 42C71 42 75 46 75 52V64C75 76 66 86 52 88" stroke="#e3127d" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </a>

        </div>

    </div>

</body>
</html>
