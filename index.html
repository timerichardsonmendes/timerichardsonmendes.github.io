<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikolas Ferreira - Deputado Federal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Yellowtail&display=swap" rel="stylesheet">
    <style>
        :root {
            --amarelo: #f5d425;
            --azul: #2c599d;
            --verde-escuro: #115324;
            --branco: #ffffff;
            --fundo-claro: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--fundo-claro);
            color: var(--verde-escuro);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header / Hero */
        .hero {
            background-color: var(--amarelo);
            width: 100%;
            padding: 60px 20px 40px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .logo-name {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .slogan {
            font-family: 'Yellowtail', cursive;
            font-size: 2.8rem;
            color: var(--verde-escuro);
            margin-top: 10px;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Botões de Navegação */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .nav-btn {
            background-color: var(--branco);
            color: var(--verde-escuro);
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid var(--verde-escuro);
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px var(--verde-escuro);
        }

        .nav-btn:hover {
            background-color: var(--verde-escuro);
            color: var(--amarelo);
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px var(--azul);
        }

        /* Redes Sociais */
        .social-section {
            background-color: var(--azul);
            border-radius: 20px;
            padding: 30px;
            color: var(--branco);
            text-align: center;
        }

        .social-section h2 {
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            color: var(--branco);
            text-decoration: none;
            padding: 15px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: var(--amarelo);
            color: var(--azul);
            transform: scale(1.05);
        }

        .social-link i {
            font-size: 1.5rem;
        }

        /* Footer */
        footer {
            width: 100%;
            background-color: var(--verde-escuro);
            color: var(--branco);
            text-align: center;
            padding: 30px 20px;
            margin-top: auto;
            font-size: 0.8rem;
        }

        .footer-links {
            margin-top: 15px;
        }

        .footer-links a {
            color: var(--amarelo);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="logo-title">DEPUTADO FEDERAL</div>
        <div class="logo-name">NIKOLAS<br>FERREIRA</div>
        <h1 class="slogan">A Esperança Somos Nós!</h1>
    </header>

    <main class="container">
        
        <nav class="nav-grid">
            <a href="#" class="nav-btn">Emendas</a>
            <a href="#" class="nav-btn">Projetos de Lei</a>
            <a href="#" class="nav-btn">Candidatos</a>
            <a href="#" class="nav-btn">Blog</a>
            <a href="#" class="nav-btn">Sobre Mim</a>
        </nav>

        <section class="social-section">
            <h2>Redes Sociais</h2>
            <div class="social-grid">
                <a href="#" class="social-link">
                    <i class="fab fa-instagram"></i>
                    <span>nikolasferreiradm</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-youtube"></i>
                    <span>Nikolas Ferreira</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>nikolas_dm</span>
                </a>
                <a href="#" class="social-link">
                    <i class="fab fa-telegram-plane"></i>
                    <span>Nikolas Ferreira</span>
                </a>
            </div>
        </section>

    </main>

    <footer>
        <p>DEPUTADO NIKOLAS FERREIRA © TODOS OS DIREITOS RESERVADOS</p>
        <div class="footer-links">
            <a href="#">POLÍTICA DE PRIVACIDADE</a> | 
            <a href="#">TERMOS DE USO</a>
        </div>
    </footer>

    <a href="#" class="whatsapp-float" aria-label="Contato via WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
