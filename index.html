<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Richardson Mendes 15800 | Materiais Oficiais</title>
<meta name="description" content="Materiais oficiais da campanha Richardson Mendes 15800.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================= -->
  <!-- FUNDO DO SITE                                              -->
  <!-- Troque a URL abaixo pelo link do seu PNG de fundo.         -->
  <!-- Local: css/style.css → variável --bg-image                -->
  <!-- ========================================================= -->
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>

  <div class="phone-screen">

    <!-- ===================================================== -->
    <!-- CABEÇALHO / LOGOMARCAS                                 -->
    <!-- Troque os src="" pelos links dos seus PNGs.            -->
    <!-- ===================================================== -->
    <header class="header">
      <!-- PNG do selo "#TOCOM BRUNA PESSOA 15800" -->
      <img
        class="logo-selo"
        src="assets/SUBSTITUA-selo-tocom.png"
        alt="#TOCOM Bruna Pessoa 15800"
        onerror="this.classList.add('img-placeholder')">

      <!-- PNG do logotipo "Richardson Mendes - Amigo do Povo" -->
      <img
        class="logo-nome"
        src="assets/SUBSTITUA-logo-richardson-mendes.png"
        alt="Richardson Mendes - Amigo do Povo"
        onerror="this.classList.add('img-placeholder')">

      <p class="header-subtitle">Materiais oficiais da campanha</p>
    </header>

    <!-- ===================================================== -->
    <!-- PAINEL DE BOTÕES — estilo Liquid Glass                 -->
    <!-- Arraste para cima / para baixo (como o Painel de       -->
    <!-- Notificações do iPhone) para dar aquele efeito solto.  -->
    <!-- ===================================================== -->
    <main class="sheet" id="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>

      <nav class="menu-list" id="menuList">

        <a class="glass-btn" href="#" data-target="candidatos">
          <span class="glass-btn__sheen"></span>
          <span class="glass-btn__icon">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="glass-btn__divider"></span>
          <span class="glass-btn__label">MEU CANDIDATOS</span>
          <span class="glass-btn__chevron">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

        <a class="glass-btn" href="#" data-target="grafica">
          <span class="glass-btn__sheen"></span>
          <span class="glass-btn__icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 16.5l4.5-4 3.5 3 3-2.5 4.5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="glass-btn__divider"></span>
          <span class="glass-btn__label">GRÁFICA</span>
          <span class="glass-btn__chevron">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

        <a class="glass-btn" href="#" data-target="musicas">
          <span class="glass-btn__sheen"></span>
          <span class="glass-btn__icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5.5l10-2V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <span class="glass-btn__divider"></span>
          <span class="glass-btn__label">MÚSICAS DA CAMPANHA</span>
          <span class="glass-btn__chevron">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

        <a class="glass-btn" href="#" data-target="videos">
          <span class="glass-btn__sheen"></span>
          <span class="glass-btn__icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6" width="17" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="currentColor"/></svg>
          </span>
          <span class="glass-btn__divider"></span>
          <span class="glass-btn__label">VÍDEOS DA CAMPANHA</span>
          <span class="glass-btn__chevron">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

      </nav>
    </main>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>

<script src="js/script.js"></script>
</body>
</html>
