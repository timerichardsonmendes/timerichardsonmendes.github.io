<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARIUS. - The Creative Mobile App</title>
    <!-- Font Awesome para os ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts para a tipografia -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-yellow: #fcf003;
            --text-dark: #111111;
            --text-light: #ffffff;
            --nav-gray: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container que simula a tela do celular */
        .mobile-container {
            width: 100%;
            max-width: 414px; /* Tamanho padrão de tela mobile grande */
            height: 100vh;
            max-height: 896px;
            background-color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* ----- HEADER ----- */
        header {
            display: flex;
            height: 70px;
            background-color: #fff;
            z-index: 10;
        }

        .logo {
            flex: 1;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
        }

        .user-btn {
            width: 70px;
            height: 70px;
            background-color: var(--nav-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
        }

        .user-btn i {
            font-size: 24px;
            color: #555;
            font-weight: 300;
        }

        .menu-btn {
            width: 70px;
            height: 70px;
            background-color: var(--brand-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
        }

        .menu-btn i {
            font-size: 28px;
            color: var(--text-dark);
        }

        /* ----- MAIN HERO SECTION ----- */
        .hero {
            flex: 1;
            position: relative;
            /* Imagem de fundo de uma cidade similar a Xangai */
            background-image: url('https://images.unsplash.com/photo-1548678967-f1aca5e9ff0f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px 25px;
        }

        /* Gradiente escuro sobre a imagem para dar leitura ao texto */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }

        .hero-content h1 {
            color: var(--brand-yellow);
            font-size: 34px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .hero-content h2 {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .hero-content p {
            color: #dcdcdc;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 95%;
        }

        /* Tracinhos indicadores (Slider Indicators) */
        .slider-indicators {
            display: flex;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .slider-line {
            width: 18px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .slider-line.active {
            background-color: var(--brand-yellow);
        }

        /* ----- BOTTOM NAVIGATION ----- */
        .bottom-nav {
            height: 100px;
            background-color: var(--brand-yellow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            z-index: 10;
        }

        .nav-icons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 15px;
            margin-top: 5px;
        }

        .nav-icons a {
            color: #333;
            font-size: 26px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        
        .nav-icons a:hover {
            transform: scale(1.1);
            color: #000;
        }

        /* Pontinhos inferiores do menu */
        .nav-dots {
            display: flex;
            gap: 5px;
        }

        .nav-dot {
            width: 4px;
            height: 4px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
        }

        .nav-dot.active {
            background-color: #000;
        }

        /* Ajustes responsivos para telas que não sejam mobile */
        @media (max-width: 414px) {
            .mobile-container {
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- HEADER -->
        <header>
            <div class="logo">VARIUS.</div>
            <div class="header-actions">
                <button class="user-btn">
                    <i class="fa-regular fa-user"></i>
                </button>
                <button class="menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT (HERO) -->
        <main class="hero">
            <div class="hero-content">
                <h1>THE CREATIVE</h1>
                <h2>MOBILE APP SOLUTION</h2>
                <p>You can design and create, and build the most wonderful place in the world. But it takes people to make the dream a reality.</p>
            </div>
            
            <div class="slider-indicators">
                <div class="slider-line active"></div>
                <div class="slider-line"></div>
                <div class="slider-line"></div>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <div class="nav-icons">
                <a href="#"><i class="fa-solid fa-user-group"></i></a>
                <a href="#"><i class="fa-solid fa-store"></i></a>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="#"><i class="fa-regular fa-comment"></i></a>
                <a href="#"><i class="fa-solid fa-phone"></i></a>
            </div>
            
            <div class="nav-dots">
                <div class="nav-dot active"></div>
                <div class="nav-dot"></div>
                <div class="nav-dot"></div>
            </div>
        </nav>

    </div>

</body>
</html>
