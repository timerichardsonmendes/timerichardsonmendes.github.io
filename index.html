<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richardson Mendes - Materiais Oficiais da Campanha</title>
    <!-- Font Awesome para os ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-blue: #0d5cbe;
            --brand-cyan: #52c4db;
            --brand-yellow: #fcd116;
            --text-dark: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container que simula a tela do celular */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 35px;
            border: 8px solid #333;
        }

        /* Seção Superior Branca */
        .top-section {
            background-color: #ffffff;
            padding: 25px 20px 15px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Logomarcas (Substituir o 'src' pelas suas imagens) */
        .logo-time {
            width: 85%;
            max-width: 280px;
            height: auto;
            object-fit: contain;
        }

        .logo-name {
            width: 75%;
            max-width: 240px;
            height: auto;
            object-fit: contain;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 0.5px;
            margin-top: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Seção Inferior Ciano */
        .bottom-section {
            background-color: var(--brand-cyan);
            padding: 20px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        /* 3 Botões de Acesso (Ícone em cima, texto em baixo) */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .nav-card {
            background-color: var(--brand-blue);
            color: white;
            border-radius: 16px;
            padding: 18px 8px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            height: 110px;
        }

        .nav-card:hover {
            transform: translateY(-2px);
        }

        .nav-card i {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .nav-card span {
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
        }

        /* Caixa de Redes Sociais */
        .social-box {
            background-color: var(--brand-blue);
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .social-title {
            color: var(--brand-yellow);
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            font-style: italic;
            font-weight: 500;
        }

        .social-item:last-child {
            margin-bottom: 0;
        }

        .social-item i {
            font-size: 24px;
            color: var(--brand-yellow);
            width: 24px;
            text-align: center;
            font-style: normal;
        }

        /* Botão do WhatsApp */
        .whatsapp-btn {
            background: linear-gradient(135deg, #25d366, #1ebe5d);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.02);
        }

        .whatsapp-btn i {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- SEÇÃO SUPERIOR -->
        <div class="top-section">
            <!-- Insira o link/arquivo da logo Timerichardsonmendes no src abaixo -->
            <img src="logo-timerichardsonmendes.png" alt="Time Richardson Mendes" class="logo-time">
            
            <!-- Insira o link/arquivo da logo Richardson Mendes no src abaixo -->
            <img src="logo-richardsonmendes.png" alt="Richardson Mendes Amigo do Povão" class="logo-name">

            <div class="section-title">MATERIAIS OFICIAIS DA CAMPANHA</div>
        </div>

        <!-- SEÇÃO INFERIOR -->
        <div class="bottom-section">
            
            <!-- 3 BOTÕES (Ícone em cima, texto em baixo) -->
            <div class="buttons-grid">
                <a href="#" class="nav-card">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>MEU CANDIDATOS</span>
                </a>
                <a href="#" class="nav-card">
                    <i class="fa-solid fa-print"></i>
                    <span>GRAFICAS</span>
                </a>
                <a href="#" class="nav-card">
                    <i class="fa-solid fa-id-card"></i>
                    <span>CARDS DE APOIO</span>
                </a>
            </div>

            <!-- REDES SOCIAIS -->
            <div class="social-box">
                <div class="social-title">Rede Sociais</div>
                
                <a href="https://instagram.com/richardson__mendes" target="_blank" class="social-item">
                    <i class="fa-brands fa-instagram"></i>
                    <span>richardson__mendes</span>
                </a>
                
                <a href="https://facebook.com/richardsonmendes" target="_blank" class="social-item">
                    <i class="fa-brands fa-facebook"></i>
                    <span>richardsonmendes</span>
                </a>
            </div>

            <!-- BOTÃO CANAL NO WHATSAPP -->
            <a href="#" target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i>
                Canal no WhatsApp
            </a>

        </div>

    </div>

</body>
</html>
